# Netlify가 CSV를 읽어 페이지를 만든 뒤 dist 폴더만 공개합니다.
[build]
  command = "npm run build"
  publish = "dist"
  # 생성 스크립트 변경도 반드시 새 배포에 반영합니다.
  ignore = "exit 1"

[functions]
  directory = "netlify/functions"

# 기본 보안 설정을 모든 공개 페이지에 적용합니다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
