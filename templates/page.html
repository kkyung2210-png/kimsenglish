<!doctype html>
<html lang="{{LANG}}">
<head>
  <!-- 모든 페이지가 공유하는 검색엔진 및 모바일 설정입니다. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  {{OG_IMAGE_TAGS}}
  <!-- 화면에 표시되는 내용과 같은 구조화 정보를 검색엔진에 제공합니다. -->
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
  {{BRAND_FAVICON_TAGS}}
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="/" aria-label="Kim's English 메인">
        <span class="logo-mark">{{BRAND_LOGO_MARK}}</span>
        <span class="logo-copy"><strong>{{BRAND_NAME}}</strong><small>맞춤 회화 과외</small></span>
      </a>
      <nav class="nav-menu" aria-label="주요 메뉴">
        <a href="/#lessons">수업 찾기</a>
        <a class="nav-optional" href="#process">수업 방식</a>
        <a class="nav-optional" href="#faq">자주 묻는 질문</a>
        <a class="nav-cta" href="/#consultation">상담 신청</a>
        <a class="nav-phone" href="tel:01025686630" aria-label="전화상담 010-2568-6630"><span aria-hidden="true">📞</span><span>전화상담</span></a>
      </nav>
    </div>
  </header>

  <main id="main-content">{{MAIN}}</main>

  <footer class="site-footer">
    <div class="container footer-simple">
      <a class="footer-logo" href="/">{{BRAND_LOGO_FULL}}<span>{{BRAND_NAME}}</span></a>
      <p class="footer-services">영어 · 일본어 · TOEIC · OPIC · IELTS</p>
      <a class="footer-main-phone" href="tel:01025686630" aria-label="전화 상담 010-2568-6630">📞 010-2568-6630</a>
      <p>전국 1:1 맞춤 수업</p>
      <p class="footer-copyright">© 2026 Kim's English</p>
    </div>
  </footer>
  <a class="mobile-consult" href="{{MOBILE_CONTACT_URL}}" aria-label="상담 신청하기">상담 신청하기</a>
  <script src="/utils/search.js" defer></script>
  <script src="/utils/consultation-form.js" defer></script>
  <script src="/utils/reviews-carousel.js" defer></script>
  <script>
    (() => {
      const currentPath = window.location.pathname.replace(/index\.html$/, "");
      if (currentPath !== "/" && currentPath !== "") return;

      const heroCopy = document.querySelector(".home-hero-copy");
      const heroActions = heroCopy && heroCopy.querySelector(".hero-actions");
      const regionButton = heroActions && heroActions.querySelector('a[href="#lessons"]');
      const contactButton = heroActions && [...heroActions.querySelectorAll("a")].find((link) => link !== regionButton);
      if (heroActions && regionButton && contactButton) {
        const trust = document.createElement("ul");
        trust.className = "hero-trust";
        trust.setAttribute("aria-label", "수업 신뢰 요소");
        trust.innerHTML = "<li>1:1 맞춤 수업</li><li>개인별 맞춤 설계</li><li>10년 이상 전문 강사진</li>";
        heroActions.before(trust);
        contactButton.className = "button button-primary";
        contactButton.textContent = "무료 상담 신청";
        regionButton.className = "button button-outline";
        regionButton.textContent = "지역별 수업 보기";
        heroActions.replaceChildren(contactButton, regionButton);
      }

      if (heroActions) {
        const phoneCta = document.createElement("div");
        phoneCta.className = "hero-phone-cta";
        phoneCta.innerHTML = '<span>📞 빠른 전화 상담</span><a href="tel:01025686630">010-2568-6630</a>';
        heroActions.after(phoneCta);
      }

      const processSteps = [...document.querySelectorAll("#process .process-step")];
      const processContent = [
        ["상담", "학습 목적과 가능한 시간을 먼저 확인합니다.", "상담 과정"],
        ["레벨 확인", "현재 수준과 어려운 부분을 함께 점검합니다.", "레벨 확인"],
        ["맞춤 계획", "목표에 필요한 내용과 학습 순서를 정합니다.", "맞춤 학습 계획"],
        ["수업 시작", "계획에 따라 연습하고 피드백을 이어갑니다.", "맞춤 수업 시작"],
      ];
      processSteps.slice(0, 4).forEach((step, index) => {
        step.querySelector("h3").textContent = processContent[index][0];
        step.querySelector("p").textContent = processContent[index][1];
      });

      const faqSection = document.querySelector(".home-faq");
      if (faqSection) {
        const faqItems = [...faqSection.querySelectorAll(".faq-item")];
        if (faqItems.length > 5) {
          faqItems.slice(5).forEach((item) => { item.hidden = true; item.classList.add("faq-extra"); });
          const moreButton = document.createElement("button");
          moreButton.className = "faq-more button-outline";
          moreButton.type = "button";
          moreButton.setAttribute("aria-expanded", "false");
          moreButton.textContent = "질문 더보기";
          moreButton.addEventListener("click", () => {
            const expanded = moreButton.getAttribute("aria-expanded") === "true";
            faqItems.slice(5).forEach((item) => { item.hidden = expanded; });
            moreButton.setAttribute("aria-expanded", String(!expanded));
            moreButton.textContent = expanded ? "질문 더보기" : "질문 접기";
          });
          faqSection.querySelector(".faq-list").after(moreButton);
        }
      }

      const consultationSection = document.querySelector(".home-cta-section");
      if (consultationSection) {
        const consultationHeading = consultationSection.querySelector(".consultation-heading");
        if (consultationHeading) {
          const phoneGuide = document.createElement("p");
          phoneGuide.className = "consultation-phone-guide";
          phoneGuide.innerHTML = '전화 상담을 원하시면<br><a href="tel:01025686630">010-2568-6630</a>으로 바로 연락주세요.';
          consultationHeading.append(phoneGuide);
        }
      }

      const floatingCta = document.querySelector(".mobile-consult");
      if (floatingCta) {
        floatingCta.classList.add("floating-cta");
        floatingCta.textContent = "무료 상담 신청";
        floatingCta.setAttribute("aria-label", "무료 상담 신청");
      }

      const revealTargets = [...document.querySelectorAll("main > .section")];
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
        revealTargets.forEach((target) => target.classList.add("is-visible"));
      } else {
        revealTargets.forEach((target) => target.classList.add("reveal"));
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          });
        }, { threshold: .12, rootMargin: "0px 0px -8%" });
        revealTargets.forEach((target) => observer.observe(target));
      }
    })();
  </script>
</body>
</html>
