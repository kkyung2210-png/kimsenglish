<!doctype html>
<html lang="{{LANG}}">
<head>
  <!-- 모든 페이지가 공유하는 검색엔진 및 모바일 설정입니다. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 공통 머리말: 메인과 지역 페이지에서 같은 디자인을 사용합니다. -->
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="/">김선생 회화 과외</a>
      <a class="nav-link" href="{{NAV_LINK}}">{{NAV_TEXT}}</a>
    </div>
  </header>

  <!-- 생성기가 CSV에 맞는 메인 또는 지역별 내용을 이 자리에 넣습니다. -->
  <main>{{MAIN}}</main>

  <!-- 모든 페이지가 공유하는 아래쪽 안내입니다. -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 김선생 회화 과외</span>
      <a href="{{FOOTER_LINK}}">{{FOOTER_TEXT}}</a>
    </div>
  </footer>
</body>
</html>
